name: Nightly

# The heavy tier. Everything here is too slow for a per-PR gate: mutation
# testing runs 20+ minutes per module, fuzzing is time-boxed by design, and
# BenchmarkDotNet needs a quiet machine to mean anything. ci.yml stays the fast
# gate; this runs once a day and on demand.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore JauntyQ.slnx

      - name: Build (warnings are errors)
        run: dotnet build JauntyQ.slnx -c Release --no-restore

      - name: Test
        run: dotnet test JauntyQ.slnx -c Release --no-build --verbosity normal

  fuzz:
    # First execution of tools/Extrode.JauntyQ.Fuzz ever, anywhere: the harness was
    # written on Windows, where libFuzzer is not practically available, so it
    # has been compiled but never run. Treat the first green run as the
    # harness's own smoke test, not as evidence the parser is fuzz-clean.
    #
    # The harness must be launched BY the native libfuzzer-dotnet driver, never
    # by `dotnet` directly: Fuzzer.LibFuzzer.Run needs __LIBFUZZER_SHM_ID and
    # the two pipe-id variables the driver sets, and without them it falls back
    # to RunWithoutLibFuzzer, which File.ReadAllBytes(args[1]): one file, not a
    # corpus directory. That fallback is what aborted the 2026-08-25 run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Publish the harness
        run: dotnet publish tools/Extrode.JauntyQ.Fuzz -c Release -o out/fuzz

      - name: Install SharpFuzz
        run: dotnet tool install --global SharpFuzz.CommandLine

      - name: Instrument the parser assembly
        run: sharpfuzz out/fuzz/Extrode.JauntyQ.SqlParser.dll

      - name: Fetch the libFuzzer driver
        # Pinned by tag AND digest: a release asset can be re-uploaded under an
        # unchanged tag, and this binary is handed the parser and a shell.
        run: |
          curl -sSfL -o libfuzzer-dotnet \
            https://github.com/Metalnem/libfuzzer-dotnet/releases/download/v2025.05.02.0904/libfuzzer-dotnet-ubuntu
          echo "c2c2a90d94c409a4af339a0d4f244e0442c5a5d249be0f1252ba07871f285958  libfuzzer-dotnet" \
            | sha256sum -c -
          chmod +x libfuzzer-dotnet

      # Coverage-guided fuzzing compounds only if the corpus outlives the run.
      # github.run_id never hits, so the primary key is always a miss and
      # restore-keys pulls the newest fuzz-corpus-*, the rolling-cache shape.
      - name: Restore the fuzzing corpus
        uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: out/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Fuzz (time-boxed)
        # Two corpus directories, and the order matters: libFuzzer
        # writes new units to the FIRST one only, treating the rest as
        # read-only seeds. So out/corpus accumulates across nights while the
        # 18 committed seeds in tools/Extrode.JauntyQ.Fuzz/corpus stay pristine.
        # Verified under WSL 2026-08-25: 60s took out/corpus 0 -> 2017 and left
        # the seed directory at exactly 18.
        run: |
          mkdir -p out/corpus out/fuzz-findings
          ./libfuzzer-dotnet \
            -max_total_time=600 -timeout=25 -rss_limit_mb=2048 \
            -artifact_prefix=out/fuzz-findings/ \
            --target_path="$(command -v dotnet)" \
            --target_arg=out/fuzz/Extrode.JauntyQ.Fuzz.dll \
            out/corpus tools/Extrode.JauntyQ.Fuzz/corpus

      # Housekeeping, so neither step can turn a clean fuzz run red: the job's
      # verdict stays the fuzz step's alone.
      - name: Minimize the corpus before caching it
        if: always()
        continue-on-error: true
        run: |
          mkdir -p out/corpus-min
          ./libfuzzer-dotnet -merge=1 \
            --target_path="$(command -v dotnet)" \
            --target_arg=out/fuzz/Extrode.JauntyQ.Fuzz.dll \
            out/corpus-min out/corpus tools/Extrode.JauntyQ.Fuzz/corpus
          rm -rf out/corpus
          mv out/corpus-min out/corpus
          echo "corpus entries after merge: $(find out/corpus -type f | wc -l)"

      - name: Save the fuzzing corpus
        if: always()
        continue-on-error: true
        uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: out/corpus
          key: fuzz-corpus-${{ github.run_id }}

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-findings
          path: out/fuzz-findings/
          if-no-files-found: ignore

  mutation:
    # Scores are the artifact, not a gate: no threshold fails the job, because a
    # score drop is a prompt to look rather than a defect on its own.
    #
    # Gated on CI_MUTATION_ENABLED (repo variable; unset or anything but
    # "false" runs it) and hard-capped at 4 hours -- mirrors jaunty's
    # mutation job. A GitHub Actions runner has no maximum job duration on its
    # own, so a stuck Stryker run (a hung mutant, a runaway retry loop) burns
    # the account's Actions minutes silently until someone notices, rather
    # than failing loudly at a bound someone chose on purpose.
    if: vars.CI_MUTATION_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # `include`, not a flat `project` list, because two entries (Extrode.JauntyQ.Schema and
      # its own Schema.Extraction) share one test-project directory and need different config
      # files and extra flags to disambiguate -- a flat list can't carry that. Widened
      # 2026-09-20 from 2 to 6 of 8 src projects (docs/handoffs/2026-09-20-coverage-mutation-
      # gaps-from-jaunty-probe.md); Extrode.JauntyQ.Runtime is source-free (README only) and
      # Extrode.JauntyQ.Cli is a 6-line Program.cs, neither is worth its own mutation run.
      matrix:
        include:
          - label: Extrode.JauntyQ.SqlParser.Tests
            directory: Extrode.JauntyQ.SqlParser.Tests
            configFile: ""
            extraArgs: ""
          - label: Extrode.JauntyQ.Analysis.Tests
            directory: Extrode.JauntyQ.Analysis.Tests
            configFile: ""
            extraArgs: ""
          - label: Extrode.JauntyQ.Generator
            directory: Extrode.JauntyQ.Generator.Tests
            configFile: ""
            extraArgs: ""
          - label: Extrode.JauntyQ.Cli.Core
            directory: Extrode.JauntyQ.Cli.Tests
            configFile: ""
            extraArgs: ""
          - label: Extrode.JauntyQ.Schema.Extraction
            directory: Extrode.JauntyQ.Schema.Extraction.Tests
            configFile: ""
            extraArgs: ""
          - label: Extrode.JauntyQ.Schema
            # Extrode.JauntyQ.Schema has no dedicated test project of its own. Run from
            # Schema.Extraction.Tests's directory instead (its stryker config lives alongside
            # Schema.Extraction's own, named to not collide) -- that project has a direct,
            # non-aliased ProjectReference to Schema.csproj (263 tests resolve against it,
            # verified 2026-09-20), so no --test-project/extra-test-project flag is needed here.
            # Deliberately NOT mirroring jaunty's --test-project fix: that pattern fits when a
            # sibling test project exercises the SAME real assembly under real coverage.
            # Extrode.JauntyQ.Generator.Tests doesn't qualify -- Generator (a Roslyn analyzer)
            # compile-includes Schema's sources into its own assembly (see Generator.csproj),
            # so its ordinary tests exercise that embedded copy, not the mutated Schema.dll;
            # only its two extern-alias live-round-trip tests touch the real assembly. Adding
            # it as an extra test project would mostly add build/container cost for near-zero
            # extra kills, not fix a NoCoverage gap that doesn't exist here.
            directory: Extrode.JauntyQ.Schema.Extraction.Tests
            configFile: stryker-config.schema.json
            extraArgs: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Stryker.NET
        run: dotnet tool install --global dotnet-stryker

      - name: Mutate ${{ matrix.label }}
        working-directory: tests/${{ matrix.directory }}
        run: >-
          dotnet-stryker
          ${{ matrix.configFile != '' && format('--config-file {0}', matrix.configFile) || '' }}
          ${{ matrix.extraArgs }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stryker-${{ matrix.label }}
          path: tests/${{ matrix.directory }}/StrykerOutput/
          if-no-files-found: ignore

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Run BenchmarkDotNet
        run: dotnet run --project benchmarks/Extrode.JauntyQ.Benchmarks -c Release -- --filter '*' --exporters json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks
          path: benchmarks/Extrode.JauntyQ.Benchmarks/BenchmarkDotNet.Artifacts/
          if-no-files-found: ignore
