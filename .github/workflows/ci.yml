name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # SourceLink needs full history

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore JauntyQ.slnx

      - name: Build (warnings are errors)
        run: dotnet build JauntyQ.slnx -c Release --no-restore

      - name: Test
        # Runs the full suite: unit tests plus every live dialect suite. SQLite
        # runs natively; Postgres, MySQL/MariaDB and SQL Server spin up via
        # Testcontainers (Docker is available on GitHub-hosted Linux runners).
        # The Northwind suite is no longer excluded: NorthwindFixture is fully
        # self-provisioning (it boots its own SQL Server container and applies
        # schema.sqlserver.sql), so the old "needs a pre-seeded SQL Server
        # instance" rationale no longer holds. Under GITHUB_ACTIONS the fixtures
        # rethrow on container bring-up failure (see tests/Shared/FixtureGate.cs),
        # so a broken Docker runner fails the job loudly instead of silently
        # skipping the Docker-gated matrix.
        #
        # --logger trx is required for the skip-audit step below: without it, a
        # `NotExecuted` test is invisible and `dotnet test` exits 0 anyway (see
        # scripts/skip-audit.js's header for the 2026-08-17 incident this
        # guards against). This was previously only enforced by
        # scripts/test-all.sh locally, not by this CI job itself.
        id: test
        continue-on-error: true
        run: |
          dotnet test JauntyQ.slnx -c Release --no-build --verbosity normal \
            --logger trx --results-directory artifacts/test-results

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5

      - name: Skip audit
        # Docker is reachable on GitHub-hosted Linux runners (see the Test step
        # above), so a "Docker unavailable" skip here would mean a real
        # bring-up failure, not a legitimate soft-skip -- same reasoning
        # scripts/test-all.sh uses locally.
        run: |
          deno run -A scripts/skip-audit.js \
            --results artifacts/test-results --docker-reachable true

      - name: Fail if tests failed
        # A genuine test failure outranks an unexplained skip in what it tells
        # you, so report it after the skip audit's diagnosis, but either one
        # fails the job.
        if: steps.test.outcome == 'failure'
        run: exit 1

      - name: Vulnerable package scan
        # Fails the job if any dependency has a known vulnerability.
        run: |
          set -e
          output=$(dotnet list JauntyQ.slnx package --vulnerable --include-transitive 2>&1)
          echo "$output"
          if echo "$output" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable packages detected"
            exit 1
          fi

  aot:
    # Proves the generated code is Native-AOT + trim clean: publishing the smoke
    # app with PublishAot runs the trim/AOT analyzers (warnings-as-errors) and
    # produces a self-contained native binary, which we then execute.
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish Native AOT smoke app
        run: dotnet publish samples/Extrode.JauntyQ.Aot.Smoke/Extrode.JauntyQ.Aot.Smoke.csproj -c Release -r linux-x64

      - name: Run the native binary
        run: ./samples/Extrode.JauntyQ.Aot.Smoke/bin/Release/net8.0/linux-x64/publish/Extrode.JauntyQ.Aot.Smoke

  pack:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack (artifacts only; release.yml pushes to NuGet.org on a tag)
        run: dotnet pack JauntyQ.slnx -c Release -o ./artifacts

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: ./artifacts/*.nupkg

  packaged-consumer:
    # The only job that builds a consumer against the PACKED generator. Every
    # project in the solution references it as a ProjectReference, so build-test
    # above proves nothing about the nuspec, the analyzers/dotnet/cs layout, the
    # bundled System.Text.Json closure, or the build/Extrode.JauntyQ.Generator.props
    # registration that carries JauntyQAutoCrud/JauntyQDialect to an external
    # consumer. A green solution build says nothing about whether consumers
    # compile, and a consumer reported that on 2026-08-30.
    #
    # Independent of `pack` on purpose: this packs its own feed, so it fails on
    # its own terms rather than on an artifact upload.
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Packaged-consumer smoke
        run: scripts/packaged-consumer-smoke.sh
