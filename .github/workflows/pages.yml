name: Pages

# Publishes the pre-built documentation site at dist/docs-site to GitHub Pages.
#
# The site is generated by hand and committed, so this workflow builds nothing: it uploads what is
# already in the tree. Regenerate before merging to main with
#
#   scripts/build-docs.sh
#
# main only, on purpose: main is release-only and every merge into it is one a human called, so
# nothing reaches the public site without someone deciding to publish it. workflow_dispatch covers
# the redeploy-without-a-release case.
on:
  push:
    branches: [main]
    paths:
      - 'dist/docs-site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight - a cancelled deploy can leave the site
# on a partially replaced artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/docs-site

      - id: deployment
        uses: actions/deploy-pages@v5
